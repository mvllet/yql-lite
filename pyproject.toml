[project]
name = "yql-lite"
version = "2.3.0"
description = "Weather & Stocks backend for legacy iOS (2-7) devices."
authors = [
    { name = "Mullet" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "jinja2>=3.1",
    "iso3166>=2.1",
    "yfinance>=1.7.0",
    "curl_cffi>=0.9",
    "python-dotenv>=1.0",
]

[project.scripts]
yql-lite = "yql_lite.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yql_lite"]
